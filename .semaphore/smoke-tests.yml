version: v1.0
name: Smoke Tests for Confluent CLI

agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-2

auto_cancel:
  running:
    when: "false"

execution_time_limit:
  minutes: 30

blocks:
  - name: linux/arm64
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      jobs:
        - name: "Smoke linux/arm64"
          commands:
            - checkout
            - sem-version go $(cat .go-version)
            - export PATH=$(go env GOPATH)/bin:$PATH

            - . vault-sem-get-secret v1/ci/kv/apif/cli/live-testing-data
            - . vault-sem-get-secret v1/ci/kv/apif/cli/slack-notifications-live-testing

            - export SMOKE_OS=linux SMOKE_ARCH=arm64 SMOKE_COMMAND=environment_list

            - make build-otel-smoke-metric

            - |
              if make live-test-smoke; then
                RESULT=1
              else
                RESULT=0
                echo "Smoke tests failed on linux/arm64, sending Slack notification..."
                curl -X POST -H "Content-type: application/json" --data '{}' "$SLACK_WEBHOOK_URL"
              fi

              # Report pass/fail metric (never fails the pipeline)
              ./bin/otel-smoke-metric "$RESULT" || true

              # Surface failure to Semaphore
              [ "$RESULT" = "1" ]

  - name: windows/amd64
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-windows
      jobs:
        - name: "Smoke windows/amd64"
          commands:
            - $Env:PATH += ";C:\Program Files\Git\bin"
            - checkout

            # Vault auth (vault-sem-get-secret is Linux-only; use native vault CLI on Windows,
            # following the pattern from cli-release/.semaphore/4-release-cli.yml).
            - $Env:VAULT_ADDR = "https://vault.cireops.gcp.internal.confluent.cloud"
            - vault login -no-print token=$(vault write -field=token "auth/semaphore_self_hosted/login" role="default" jwt="$Env:SEMAPHORE_OIDC_TOKEN")
            # These secrets keep everything in a single field named "script", whose value is
            # a shell script of `export NAME=value` lines. That is why asking for
            # `-field=CONFLUENT_CLOUD_EMAIL` failed with `Field "CONFLUENT_CLOUD_EMAIL" not
            # present in secret` -- no such field exists. The linux/arm64 job above sources
            # that script; PowerShell cannot, so parse the assignments out of it instead.
            # Only the variables the job needs are exported, so anything else these secrets
            # define never reaches the environment of `go test` and its children.
            # Values are never echoed; only variable names appear, and only on failure.
            - |
              function Import-VaultScript($Path, $Names) {
                # Check the exit code before touching the output: on a partial response,
                # downstream errors could echo the input, which holds secrets.
                $script = vault kv get -field=script $Path
                if ($LASTEXITCODE -ne 0) { throw "failed to read Vault secret $Path" }

                $defined = @{}
                foreach ($line in ($script -split "\r?\n")) {
                  if ($line -notmatch '^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$') { continue }

                  $name = $Matches[1]
                  $value = $Matches[2].Trim()

                  # Strip one layer of surrounding quotes, as `source` would.
                  foreach ($quote in '"', "'") {
                    if ($value.Length -ge 2 -and $value.StartsWith($quote) -and $value.EndsWith($quote)) {
                      $value = $value.Substring(1, $value.Length - 2)
                      break
                    }
                  }
                  $defined[$name] = $value
                }

                # Fail here rather than 20 minutes later inside `go test`, which would only
                # report "required environment variable ... is not set".
                foreach ($name in $Names) {
                  if (-not $defined.ContainsKey($name) -or [string]::IsNullOrEmpty($defined[$name])) {
                    throw "secret $Path does not define $name (defines: $(($defined.Keys | Sort-Object) -join ', '))"
                  }
                  [Environment]::SetEnvironmentVariable($name, $defined[$name])
                }
              }

              Import-VaultScript v1/ci/kv/apif/cli/live-testing-data @("CONFLUENT_CLOUD_EMAIL", "CONFLUENT_CLOUD_PASSWORD")
              Import-VaultScript v1/ci/kv/apif/cli/slack-notifications-live-testing @("SLACK_WEBHOOK_URL")

            # Install Go (matches the pattern in semaphore.yml; chocolatey is community-maintained)
            - $ProgressPreference = 'SilentlyContinue'; Invoke-WebRequest -OutFile Go.zip -Uri https://go.dev/dl/go$(Get-Content .go-version).windows-amd64.zip -UseBasicParsing
            - 7z x Go.zip -oC:\

            # MSYS2 + mingw GCC (CGO is enabled for confluent CLI builds)
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { curl.exe -L --retry 5 --retry-delay 5 -o msys2.tar.xz https://repo.msys2.org/distrib/x86_64/msys2-base-x86_64-20260322.tar.xz }
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { 7z x msys2.tar.xz }
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { 7z x msys2.tar -oC:\ }
            - C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mingw-w64-x86_64-gcc"
            - $Env:PATH = "C:\msys64\mingw64\bin;C:\Go\bin;C:\Users\semaphore\go\bin;$Env:PATH"
            - $Env:CC = "x86_64-w64-mingw32-gcc"
            - $Env:EXISTING_FLAGS = $(go env CGO_LDFLAGS)
            - go env -w CGO_LDFLAGS="-fstack-protector $Env:EXISTING_FLAGS"

            - $Env:SMOKE_OS = "windows"
            - $Env:SMOKE_ARCH = "amd64"
            - $Env:SMOKE_COMMAND = "environment_list"

            # Build emitter + CLI directly (no `make` available without bash; mirrors Makefile targets)
            - go build -o bin\otel-smoke-metric.exe .\cmd\otel-smoke-metric
            - go build -ldflags="-s -w -X main.disableUpdates=true" -o test\live\bin\confluent.exe .\cmd\confluent

            - $Env:CLI_LIVE_TEST = "1"

            # Run smoke + emit metric + Slack on failure as a single block so a non-zero
            # `go test` exit code does NOT abort the job before metric emission.
            - |
              go test ./test/live/ -v -run='.*Live$' -tags='live_test,smoke' -timeout 30m -parallel 4
              if ($LASTEXITCODE -eq 0) {
                $RESULT = "1"
              } else {
                $RESULT = "0"
                Write-Host "Smoke tests failed on windows/amd64, sending Slack notification..."
                try {
                  Invoke-RestMethod -Method Post -Uri $Env:SLACK_WEBHOOK_URL -ContentType "application/json" -Body "{}"
                } catch {
                  Write-Host "Slack notification failed: $_"
                }
              }

              # Report pass/fail metric (never fails the pipeline; emitter always exits 0)
              & .\bin\otel-smoke-metric.exe $RESULT

              # Surface failure to Semaphore at the very end
              if ($RESULT -ne "1") { exit 1 }
