version: v1.0
name: Confluent CLI

agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

auto_cancel:
  running:
    when: "branch != 'main'"

# Raised from 1h so the merge-queue live-test block below (which only runs on
# gh-readonly-queue/* branches) has room; normal PR/branch runs finish quickly and
# are unaffected -- this is a ceiling, not a fixed duration.
execution_time_limit:
  hours: 12

blocks:
  - name: linux/amd64
    dependencies: []
    task:
      jobs:
        - name: "Test linux/amd64"
          commands:
            - checkout
            - . vault-get-secret cli/sonar-token
            - sem-version go $(cat .go-version)
            - export PATH=$(go env GOPATH)/bin:$PATH
            - make generate-packaging-patch
            - diff -w -u <(git cat-file --filters HEAD:debian/patches/standard_build_layout.patch | awk "{if (NR>3) {print}}") <(cat debian/patches/standard_build_layout.patch | awk "{if (NR>3) {print}}")
            - make lint
            - make test
            - make coverage
            - make test-installer
# Temporarily disable these builds until rate limiting is resolved
#        - name: "Build linux/amd64 (GLIBC)"
#          commands:
#            - checkout
#            - docker build . --file docker/Dockerfile_build_linux_amd64 --tag test-build
        - name: "Build linux/amd64 (Alpine)"
          commands:
            - checkout
            - docker build . --file docker/Dockerfile_alpine_amd64 --tag test-build
      epilogue:
        always:
          commands:
            # --ignore-missing: build-only jobs run no tests; an early failure can leave one unwritten
            - test-results publish unit-test-report.xml integration-test-report.xml -N "linux/amd64" --ignore-missing

  - name: linux/arm64
    run:
      when: "branch = 'main'"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-arm64-1
      jobs:
# Temporarily disable these builds until rate limiting is resolved
#        - name: "Build linux/arm64 (GLIBC)"
#          commands:
#            - checkout
#            - docker build . --file docker/Dockerfile_build_linux_arm64 --tag test-build
        - name: "Build linux/arm64 (Alpine)"
          commands:
            - checkout
            - docker build . --file docker/Dockerfile_alpine_arm64 --tag test-build

  - name: windows/amd64
    run:
      when: "branch = 'main'"
    dependencies: []
    task:
      agent:
        machine:
          type: s1-prod-windows
      jobs:
        - name: "Build & Test windows/amd64"
          commands:
            - checkout
            # https://confluentinc.atlassian.net/browse/DP-9532
            # Do not install Go with Chocolatey since it is community maintained and may not have the latest version
            - $ProgressPreference = 'SilentlyContinue'; Invoke-WebRequest -OutFile Go.zip -Uri https://go.dev/dl/go$(Get-Content .go-version).windows-amd64.zip -UseBasicParsing
            - 7z x Go.zip -oC:\
            # Install MSYS2 and mingw-w64 GCC to match the release pipeline
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { curl.exe -L --retry 5 --retry-delay 5 -o msys2.tar.xz https://repo.msys2.org/distrib/x86_64/msys2-base-x86_64-20260322.tar.xz }
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { 7z x msys2.tar.xz }
            - if (!(Test-Path "C:\msys64\usr\bin\bash.exe")) { 7z x msys2.tar -oC:\ }
            - C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mingw-w64-x86_64-gcc"
            - $Env:PATH = "C:\msys64\mingw64\bin;C:\Go\bin;C:\Users\semaphore\go\bin;$Env:PATH"
            - $Env:CC = "x86_64-w64-mingw32-gcc"
            - $Env:EXISTING_FLAGS = $(go env CGO_LDFLAGS)
            - go env -w CGO_LDFLAGS="-fstack-protector $Env:EXISTING_FLAGS"
            - $Env:GOCOVERDIR = "test/coverage"
            - New-Item $Env:GOCOVERDIR -ItemType Directory
            - go install gotest.tools/gotestsum@v1.8.2
            - gotestsum --junitfile unit-test-report.xml -- -timeout 0 -v $(go list ./... | Select-String test -NotMatch) -ldflags "-buildmode=exe"
            - gotestsum --junitfile integration-test-report.xml -- -timeout 0 -v $(go list ./... | Select-String test)
            - go tool covdata textfmt -i $Env:GOCOVERDIR -o test/coverage.out
      epilogue:
        always:
          commands:
            - test-results publish unit-test-report.xml integration-test-report.xml -N "windows/amd64" --ignore-missing

  # Automatic pre-merge gate: GitHub merge queue builds a temporary
  # gh-readonly-queue/main/* branch (main + the queued PR(s)); this block runs ONLY
  # there, so the affected live tests must pass before the PR merges -- no manual
  # click. On normal PR/branch runs the `run/when` skips it, so this pipeline's
  # required check passes fast and the PR can enter the queue.
  # Requires: merge queue enabled on main, and this pipeline's check kept required.
  # If Semaphore does NOT build gh-readonly-queue branches, do NOT make it required
  # (the queue would deadlock waiting for a check that never runs).
  - name: "Relevant Live Tests (merge queue)"
    dependencies: ["linux/amd64"]
    run:
      when: "branch =~ '^gh-readonly-queue/'"
    task:
      jobs:
        - name: "Detect & run affected live tests"
          execution_time_limit:
            hours: 8
          commands:
            - checkout
            - sem-version go $(cat .go-version)
            - export PATH=$(go env GOPATH)/bin:$PATH
            - . vault-sem-get-secret v1/ci/kv/apif/cli/live-testing-data
            - |
              set -e
              GROUPS="$(BASE_REF=origin/main bash scripts/live-test-affected-groups.sh)"
              echo "Affected live-test groups: $GROUPS"
              if [ "$GROUPS" = "NONE" ]; then
                echo "Nothing with live coverage changed; skipping live tests."
              elif [ "$GROUPS" = "all" ]; then
                make live-test
              else
                make live-test CLI_LIVE_TEST_GROUPS="$GROUPS"
              fi

after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
      - name: Report SonarQube Results
        commands:
          - checkout
          - sem-version java 17
          - emit-sonarqube-data -a coverage.txt --enable_sonarqube_enterprise

promotions:
  - name: "Run macOS builds (manual)"
    pipeline_file: ".semaphore/macos.yml"
  - name: "Run live integration tests"
    pipeline_file: ".semaphore/live-tests.yml"
  - name: "Run relevant live tests (PR)"
    pipeline_file: ".semaphore/live-tests-pr.yml"
